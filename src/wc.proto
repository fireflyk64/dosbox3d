syntax = "proto2";

// Position vectors optimized for values not close to 0
message FixedVector {
        required sfixed32 x = 1;
        required sfixed32 y = 2;
        required sfixed32 z = 3;
}

// Wing commander stored orientations as 32-bit from -256 to 256 inclusive
message Vector {
        required sint32 x = 1;
        required sint32 y = 2;
        required sint32 z = 3;
}

message Location {
        optional FixedVector pos = 1;
        optional Vector vel = 2;
        optional Vector right = 3;
        optional Vector up = 4;
        optional Vector fore = 5;
        optional uint32 set_speed = 6;
}

message Damage {
        optional Vector pos = 1;
        optional uint32 shooter = 2; // 16 bits
        optional uint32 quantity = 3; // 16 bits
        optional uint32 ship_id = 4;
        optional fixed32 seed = 5;
}

message WeaponFire {
        optional uint32 gun_id = 1; // 4 bits
        optional uint32 shooter = 2;
        optional uint32 ship_id = 3; // if missile, which id?
        // Set by a client that already fired locally (client-side prediction).
        // The server echoes it back unchanged so the client can recognise its
        // own shot and only record the missile id mapping instead of firing twice.
        optional uint32 client_seq = 4;
        // Network id of the ship the shooter had locked (dseg:C284[shooter])
        // at the moment of firing; missiles inherit it when spawned, so the
        // replaying machine sets it before calling fireGunFromShip.
        optional uint32 target = 5;
        // The shooter's own record for that gun and how many guns it had,
        // read just before the shot.  A hit can knock a random gun off a
        // ship and the machines do not always pick the same one, so the
        // replaying machine fires what the shooter fired, not whatever its
        // own table has under that number.
        optional bytes gun = 6;
        optional uint32 guns = 7;
}

// Authoritative per-ship health snapshot.  Wing Commander applies damage with
// two different models depending on the ship slot (slot 0 = the local player,
// slots 1-9 = NPC), so the owner of a ship replicates the resulting state
// instead of every machine replaying the hit.  Field comments give the
// data-segment arrays (see scripts/wcdis.py sym dseg:XXXX).
message ShipHealth {
        repeated sint32 shield = 1 [packed=true];      // dseg:C430 curShield[2] (front, rear)
        repeated sint32 shield_max = 2 [packed=true];  // dseg:C988 shieldMax[2]
        repeated sint32 armor = 3 [packed=true];       // dseg:C85E armorState[4]
        optional sint32 damage_points = 4;             // dseg:C17A accumulated hull damage
        optional uint32 core_hp = 5;                   // dseg:C8B8 core hit points (starts at 4)
        optional uint32 hull_counter = 6;              // dseg:D22C internal damage counter
        optional uint32 state_byte = 7;                // dseg:D1A2 ship state
        optional uint32 gun_damage = 8;                // dseg:BD0E
        optional uint32 engine_flag = 9;               // dseg:BFD6
        optional sint32 gun_energy = 10;               // dseg:BE3A
}

message Spawn {
        optional uint32 mission_ship_id = 1;
        optional uint32 situation_id = 2;
        optional uint32 ship_id = 3;
        optional fixed32 seed = 5;
        // dseg:D1A2 of the slot once the mission setup has run: 0-7 one of the
        // eight named wingmen (name, face, orders menu), 8 the player, 9-12 an
        // enemy ace.  The replaying side writes it, since the replayed spawn
        // only builds the ship.
        optional uint32 pilot = 6;
        // A second ship of a mission ship that is in a slot already (Wing
        // Commander's third seat): the game refuses one it finds in its slot
        // table, so the replaying side hides that entry for the call too.
        optional bool again = 7;
}

message Despawn {
        optional uint32 ship_id = 1;
        optional uint32 shooter = 2;
        optional uint32 explode = 3;
}

message ShipUpdate {
        optional uint32 ship_id = 1; // 16 bits
        optional Location loc = 2;
        optional ShipHealth health = 3; // only from the ship's owner
}

enum GameState {
     Proceed = 0;
     EndLand = 1;
     EndEject = 2;
     EndCarrier = 3;
     EndDeath = 4;
     EndExit = 5;
     // RetroVega: the home carrier was destroyed (missionStatus 6), a shared
     // ending with the death screen's choice (retrovega/docs/multiplayer.md).
     EndCarrierLost = 6;
}

enum AutoPilotState {
     Disengaged = 0;
     Engaged = 1;
     Finished = 2;
}

message AutoPilotEvent {
   optional uint32 cam_ship_type = 1;
   optional uint32 cam_mode = 2;
   optional uint32 duration = 3;
   optional bool finish_camera = 4;
}

// A gunner's shot from one of the leader's turrets (WC2): the turret's aim is
// the camera's orientation on the gunner's machine, its place the camera's
// offset from the ship.
message TurretFire {
        optional Vector right = 1;
        optional Vector up = 2;
        optional Vector fore = 3;
        optional Vector offset = 4;
        optional uint32 barrels = 5;  // which pair of barrel offsets (dseg:CDA8)
}

// A ship switched its cloaking device (WC2's stealth fighters).  The
// server's AI decides; the clients' own copies of it are not asked.
message Cloak {
        optional uint32 ship_id = 1;
        optional bool on = 2;
}

// A drone's hand on the leader's ship (its copilot's role in a mission the
// story flies alone): energy moved between the leader's shields and guns,
// and the leader's cruising speed.  From a drone to the server only.
message Copilot {
        enum Action {
                SHIELDS_TO_REAR = 1;     // the Up key
                SHIELDS_TO_FRONT = 2;    // Down
                SHIELDS_TO_GUNS = 3;     // the fire key
                GUNS_TO_WEAKEST = 4;     // the missile key: into whichever shield is lower
                SPEED_UP = 5;            // + and -: the leader's set speed, as the leader's own keys
                SPEED_DOWN = 6;
        }
        optional Action action = 1;
}

// RetroVega, client -> server: this player taunted an enemy fighter (the comm
// menu's taunt, C three times, Alt+T): the ship's network id.  The host's AI,
// which flies it, turns it on that player's ship for its anger's time
// (logic.c logic_taunt, the fixed block's rvTaunt).  Without it a guest's
// taunt fell on the guest's own copy of the ship, a puppet nobody thinks for.
message Taunt {
        optional uint32 ship_id = 1;
}

message Event {
  optional Spawn spawn = 2;
  optional Damage damage = 3;
  optional WeaponFire fire = 4;
  optional Despawn despawn = 5;
  optional AutoPilotEvent autopiloting = 16;
  optional TurretFire turret = 17;
  optional Cloak cloak = 18;
  optional Copilot copilot = 19;
  optional Taunt taunt = 20;
}

message MissionEnd {
    optional GameState game_update = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 victory_points_plus_one = 3;
    // Server -> client, Wing Commander II: the host's campaign record as its
    // flight loop returned.  The campaign loop branches on fields of it that
    // the flight fills (the mission's counters, the result at the loop's
    // tail): a wingman's game, given the record, goes the host's way -- a
    // scripted "landing" that is a cutscene and a second flight (Series 1,
    // mission 4) instead of its own plain landing.
    optional bytes campaign_state = 4;
    // Server -> client, Wing Commander 1: the ship the host landed on, as a
    // network id plus one.  The landing sequence draws the carrier from the
    // game's "landed on" word, which only the game's own landing check
    // writes: a wingman landed by the host's word had none, and the Tiger's
    // Claw was missing from its landing.
    optional uint32 landed_on_plus_one = 5;
}

// Client -> server: this player's own mission ended (death or ejection).  The
// server removes the player's ship and the mission continues for everyone
// else.  Landing is still a shared mission end and travels in MissionEnd.
message PlayerEnd {
    optional GameState state = 1;
    // RetroVega: a guest that landed says on which ship (its network id + 1),
    // so the host's game lands everyone on it, and scores the landing.
    optional uint32 landed_on_plus_one = 2;
}

message Frame {
    repeated ShipUpdate update = 1; // one update per updated ship
    repeated Event event = 2;
    optional MissionEnd mission_end = 18;
    optional PlayerEnd player_end = 19;
    // Server -> client: whether the mission has its asteroid and mine fields
    // (1), not (0), or has them with rocks that do little damage to a
    // player's own ship (2).  Sent with the mission start state and when the
    // host changes it in flight; each machine then removes or restores its own.
    optional uint32 rocks = 20;
    // Server -> client: WingBumps (wcnet_events.h): 1 = two humans' ships touch for no damage, 0 = the game's.
    optional uint32 wing_bumps = 27;
    // From a gunner: the turret it mans plus one (0: none), so that the
    // server's automatic fire leaves that turret to it.
    optional uint32 manned_turret = 21;
    // Client -> server: the number of the last server frame this client had
    // applied when it sent this.  The server runs on without waiting for a
    // client's frame, as long as the client is not too many frames behind.
    // Server -> client: the number of the last client frame taken in.
    optional uint64 ack = 22;
    // With the ack: for how long (ms) the acked frame had been here when
    // this one was sent, so that the other side has the round trip from its
    // own clock alone (LinkMonitor in wcnet_session.cpp).
    optional uint32 ack_delay = 23;
    // Client -> server: the client's frames in its last second, the
    // server's view of how the wingman's game is doing.
    optional uint32 fps = 24;
    // Server -> client: the exchange mode from this frame on (ExchangeMode
    // in wcnet_session.h: 1 the client waits for every server frame, 2 it
    // paces itself and takes the server's frames as they come).  Sent with
    // the start state and whenever it changes.
    optional uint32 mode = 25;
    // Client -> server, false: this client's game has left the flight loop
    // for this mission (its landing, the debriefing, the barracks, the DOS
    // prompt).  The server waits for the frames of a wingman in flight,
    // however long a scene holds it; one out of flight is not waited for,
    // nor sent frames, whether or not its ending (player_end) was seen.
    optional bool flying = 26;
    // Server -> client: the network ids of the ships humans fly, the host's 0
    // among them, in every frame and in the start state.  A client holds the
    // AI off these and computes no damage to them (session.h: a human's ship
    // is its owner's), the host's body and the other wingmen's alike.
    repeated uint32 humans = 28;
}

// Connect -> once per mission
message Connect {
    optional string callsign = 1;
    optional string lastname = 2;
}

message Game {
    optional uint32 mission_id = 1;
    required uint32 assigned_player_id = 2;
    optional Frame starting_state = 3;
    // What this client is in the mission (Seat in wcnet_session.h): 0 flies
    // the ship the mission has for a wingman (assigned_player_id is its
    // slot on the server); 1 a drone, for missions the story flies alone: a
    // ship that exists on the client's machine only; 2 the gunner, in such a
    // mission when the leader's ship has turrets: the client rides in it.
    optional uint32 seat = 4;
    // The server's pace, frames a second: a client that paces itself keeps it.
    optional uint32 fps = 5;
    // A gunner: the view it starts in (3 the rear turret, 1 and 2 the side
    // turrets: a second gunner takes another turret).
    optional uint32 start_view = 6;
}

message ClientStartMissionReq {

}
message ClientStartBriefingReq {

}
message Chat {
    optional string message = 1;
    optional uint32 ship_id = 2;
    optional string callsign = 3;
}
// Where a pilot is in its game (RetroVega's rvWhere: the bar, the briefing, flying, ...), out of band like chat:
// a pilot sends its own when it changes and every few seconds, the host relays a guest's to the others with its
// player number, and the host's says whether its mission has begun (a guest's briefing door opens then).
message Presence {
    optional uint32 player = 1;     // whose (the host's 0; set by the host when it relays)
    optional uint32 place = 2;      // RV_WHERE_*, 0 not known
    optional bool briefed = 3;      // the host's: its mission has begun (at its briefing or flying it)
}
message ServerSendBriefingStart {
    optional uint32 mission_id = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 series_id = 3;
    // As Frame.rocks: known before the client sets up its first nav point.
    optional uint32 rocks = 4;
    optional uint32 wing_bumps = 6;  // WingBumps, as Frame.wing_bumps
    // WC2: the server's campaign record (what a saved game holds: where the
    // story is, who is alive), as it was when "Fly mission" was chosen.  The
    // client takes it over, so that its briefing, its mission and what it
    // finds in them are the server's.
    optional bytes campaign_state = 5;
    // RetroVega: the mission's records as the host's game compiled them
    // (missionShipTable, navPointTable, and the record the player flies).  A
    // guest's own save can number them differently (a wingman it lost is left
    // out), and every spawn names a record: the guest flies by the host's.
    // Nothing of either player's save goes across.
    optional bytes mission_ship_table = 7;
    optional bytes nav_point_table = 8;
    optional uint32 player_mission_ship = 9;
}
// Server -> client, out of band (polled like chat, so that a wingman waiting
// for a frame sees it): the host's game is starting an in-flight scene of
// the mission's script (WC2: a nav point's cutscene, armed on every machine
// by the nav point's own steps) and sends no frames for its length.  A
// wingman whose game has the same scene pending plays it now, instead of
// after the host's.
message InFlightScene {
    optional uint32 scene = 1;
}
// TIE Fighter (docs/tiefighter.md, wcnet_tie_session.cpp).  A guest's hello
// (its callsign) and the host's answer: the guest's player number, which is
// its craft in the mission's player flight group, and the room's seats.
message TieHello {
    optional string callsign = 1;
    optional uint32 player = 2;
    optional uint32 seats = 3;
}
// One craft as its owner's game has it.  The object slots are the same on
// every machine: the same mission file set up in the same order.
message TieCraft {
    optional uint32 obj = 1;
    optional uint32 owner = 2;
    optional sint32 x = 3;
    optional sint32 y = 4;
    optional sint32 z = 5;
    optional uint32 heading = 6;
    optional uint32 pitch = 7;
    optional uint32 roll = 8;
    optional sint32 speed = 9;
    optional sint32 mx = 10;        // the move vector (Q15)
    optional sint32 my = 11;
    optional sint32 mz = 12;
    optional uint32 type = 13;      // the ship type; 0: the craft is gone
    optional bytes axes = 14;       // the forward/side/up vectors, 9 int16 (FlightObject +0x42)
    optional bool dying = 15;       // its death under way on its owner's machine (the others kill their copy)
    // Its damage, its owner's (CraftData): past the shields (+0xA2), the shields (+0xCA, +0xCC), the systems (+0xAE).
    optional uint32 hull = 16;
    optional sint32 shield_front = 17;
    optional sint32 shield_rear = 18;
    optional uint32 systems = 19;
    // Dying: the craft whose shot, decided on its own machine and applied here, began the death (that machine's pilot
    // is credited the kill there; none: a death of this machine's own).
    optional uint32 killer = 20;
}
// A shot (TIE Fighter): the shooter's object, the hardpoint, the projectile's type, as laser_createprojectile took them.
message TieShot {
    optional uint32 obj = 1;
    optional uint32 hardpoint = 2;
    optional uint32 type = 3;
}
// A hit decided on the shooter's machine, for the target's owner to apply (with a stand-in bolt of these figures).
message TieHit {
    optional uint32 target = 1;
    optional uint32 offset = 2;     // collide_laserhitcraft's hit offset
    optional uint32 bolt_type = 3;
    optional uint32 bolt_genus = 4;
    optional uint32 bolt_radius = 5;
    optional uint32 shooter = 6;
    optional sint32 x = 7;          // the bolt's segment (laserx.. and laserxold..)
    optional sint32 y = 8;
    optional sint32 z = 9;
    optional sint32 ox = 10;
    optional sint32 oy = 11;
    optional sint32 oz = 12;
    optional sint32 cx = 13;        // the impact's place from (ox, oy, oz), the collision test's (collidexoff..)
    optional sint32 cy = 14;
    optional sint32 cz = 15;
}
// A frame of craft from their owner, best effort (the next supersedes it);
// the host relays a guest's to the other guests with its player number.
message TieFrame {
    optional uint32 player = 1;
    optional uint64 frame = 2;
    optional uint32 ticks = 3;      // the sender's frameticks
    repeated TieCraft craft = 4;
    optional bool flying = 5;       // the sender is in a flight
    optional string mission = 6;    // the mission it flies (a frame of another mission's is not written in)
    optional uint32 own = 7;        // the sender's own craft (its object slot)
    optional uint32 target = 8;     // what the sender has targeted (an object slot; 0xFFFF none)
    repeated TieShot shots = 9;
    repeated TieHit hits = 10;
    repeated TieEvent events = 11;  // what a pilot did to the mission on its own machine (sent reliably)
}
// A pilot's doing that the mission's state keeps on that pilot's machine alone (the user, 2026-11-07: "If it fails to
// show up for a player that's a serious bug"): 1, reinforcements called (the S key and Space: the mission's penalty
// flag, which the "reinforced" arrivals wait for); 2, a craft inspected (it targeted near enough: the craft's flag and
// its flight group's inspected count, which goals and arrivals read); 3, a craft of the sender's begun to die (its
// owner's word, whatever the craft's distance: a death lasts some 60 ticks, which the reports of a craft far from the
// other pilots, every 10th frame or fewer, could miss); 4, a craft of the sender's gone through hyperspace (exit 3) or into a
// hangar (exit 4): its owner's AI took it, a held copy never would.
message TieEvent {
    optional uint32 kind = 1;
    optional uint32 obj = 2;        // (2, 3) the craft's object slot
    optional uint32 type = 3;       // (2, 3) its ship index there (the same craft: +4)
    optional uint32 fg = 4;         // (2, 3) and its flight group (+0x35)
    optional uint32 killer = 5;     // (3) the craft whose hit began the death (its object slot), when known
    optional uint32 exit = 6;       // (4) 3 hyperspace, 4 a hangar (score_craftexitscoring's kind)
}
// The host's word on who flies each craft (object slots 0..31): a seat each, 0 the host's.  Sent when it changes and
// every 2 s, reliably.
message TieOwners {
    repeated uint32 owner = 1;
    optional string mission = 2;
}
// Where a pilot is (TIE Fighter): its front end's scene (OpenTIE's SCENE_*), whether it flies, and the mission its
// front end launches (the mission file's name).  Sent when it changes and every few seconds; the host relays a guest's
// to the other guests with its seat.
message TiePresence {
    optional uint32 player = 1;
    optional string callsign = 2;
    optional sint32 scene = 3;
    optional bool flying = 4;
    optional string mission = 5;
    optional bool challenge = 6;    // its mission flown as the Z-95 challenge (step 14)
}
// Wing Commander: Privateer (docs/privateer.md).  A guest's hello, and the host's answer: the guest's seat and the
// room's seats.
message PrivHello {
    optional string callsign = 1;
    optional uint32 player = 2;
    optional uint32 seats = 3;
}
// Where a pilot is (Privateer): flying or not, its system (the name the game shows), its place in the system (the
// game's world units: 256 to the game's metre), and why it was sent now (PrivWhy).  Sent on those occasions and every
// 15 s; the host relays a guest's to the other guests with its seat.
message PrivPresence {
    optional uint32 player = 1;
    optional string callsign = 2;
    optional bool flying = 3;
    optional string system = 4;
    optional sint32 x = 5;
    optional sint32 y = 6;
    optional sint32 z = 7;
    optional uint32 why = 8;        // 0 the period, 1 the autopilot engaged (A), 2 a jump, 3 a launch, 4 a landing, 5 a hello, 6 a nav point entered or left
    optional sint32 nav = 9;        // the nav sphere the pilot is in (the game's sphere id, 0..7; -1 none)
    repeated uint32 missions = 10 [packed = true];  // the nav spheres the pilot has a mission objective at
}
// A nav point's owner (the host's word, docs/privateer.md section 9): of the pilots present at it, the one whose game
// runs its encounter for everybody.  Sent reliably when it changes and every few seconds.
message PrivOwner {
    optional string system = 1;
    optional sint32 nav = 2;
    optional uint32 owner = 3;      // a seat
}
message PrivOwners {
    repeated PrivOwner owners = 1;
}
// A ship of the game's own (an encounter's) as its owner's machine flies it: its identity (the owner's near pointer),
// what to make it as (type, appearance, cast: the AI's file), place, attitude, velocity, whether it lives, its armour.
message PrivNpc {
    optional uint32 id = 1;
    optional string type = 2;
    optional string appearance = 3;
    optional string cast = 4;
    optional sint32 x = 5;
    optional sint32 y = 6;
    optional sint32 z = 7;
    repeated sint32 m = 8 [packed = true];
    optional sint32 vx = 9;
    optional sint32 vy = 10;
    optional sint32 vz = 11;
    optional bool alive = 12;
    repeated sint32 armor = 13 [packed = true];     // the four quadrants
}
// The owner's encounter ships, best effort, while another pilot is near; the host relays a guest's with its seat.
message PrivScene {
    optional uint32 player = 1;
    optional uint64 frame = 2;
    optional string system = 3;
    repeated PrivNpc npc = 4;
}
// A hit decided on one machine on a ship another machine flies (a pilot's own ship, or an encounter ship its owner
// runs): the owner applies it (reliable; the host relays).  id 0: the owner's own ship.
message PrivHit {
    optional uint32 player = 1;     // the sender
    optional uint32 owner = 2;      // the seat whose ship it is
    optional uint32 id = 3;
    optional sint32 loc = 4;        // the quadrant hit (0..3)
    optional sint32 damage = 5;
}
// An encounter ship of the sender's fired its guns (best effort): the others' copies fire too.
message PrivShot {
    optional uint32 player = 1;
    optional uint32 id = 2;
}
// A pilot's ship as its own machine flies it (Privateer), best effort, while another pilot shares its system: its place
// (world units), attitude (3x3, 1.0 = 256), velocity (units a second, from its last places) and appearance (what the
// others make it as: CLUNKER a Tarsus, TUG an Orion, FIGHTER a Centurion, MERCHANT a Galaxy).  The host relays a
// guest's with its seat.
message PrivState {
    optional uint32 player = 1;
    optional uint64 frame = 2;
    optional string system = 3;
    optional sint32 x = 4;
    optional sint32 y = 5;
    optional sint32 z = 6;
    repeated sint32 m = 7 [packed = true];
    optional string appearance = 8;
    optional sint32 vx = 9;
    optional sint32 vy = 10;
    optional sint32 vz = 11;
}
message NetworkMessage {
    optional Connect connect = 1;
    optional Game game = 2;
    optional Frame frame = 3;
    optional ClientStartMissionReq start_mission_req = 4;
    optional uint32 epoch = 5;
    optional uint64 frame_number = 6;
    optional Chat chat = 7;

// handshake
    optional ClientStartBriefingReq start_briefing_req = 16;
    optional ServerSendBriefingStart briefing_start = 17;
    optional InFlightScene in_flight_scene = 18;
    // Server -> client, out of band (polled like chat: the guest is on its
    // death screen, out of any flight): the host's choice there, 1 fly the
    // mission again, 2 carry on (RetroVega's restartChoice).
    optional uint32 restart_choice = 19;
    optional Presence presence = 20;
    optional TieHello tie_hello = 21;
    optional TieFrame tie_frame = 22;
    optional TiePresence tie_presence = 23;
    optional TieOwners tie_owners = 24;
    // Privateer's (field numbers from 40: TIE Fighter's grow from 25)
    optional PrivHello priv_hello = 40;
    optional PrivPresence priv_presence = 41;
    optional PrivState priv_state = 42;
    optional PrivOwners priv_owners = 43;
    optional PrivScene priv_scene = 44;
    optional PrivHit priv_hit = 45;
    optional PrivShot priv_shot = 46;
}

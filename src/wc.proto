syntax = "proto2";

// Position vectors optimized for values not close to 0
message FixedVector {
        required sfixed32 x = 1;
        required sfixed32 y = 2;
        required sfixed32 z = 3;
}

// Wing commander stored orientations as 32-bit from -256 to 256 inclusive
message Vector {
        required sint32 x = 1;
        required sint32 y = 2;
        required sint32 z = 3;
}

message Location {
        optional FixedVector pos = 1;
        optional Vector vel = 2;
        optional Vector right = 3;
        optional Vector up = 4;
        optional Vector fore = 5;
        optional uint32 set_speed = 6;
}

message Damage {
        optional Vector pos = 1;
        optional uint32 shooter = 2; // 16 bits
        optional uint32 quantity = 3; // 16 bits
        optional uint32 ship_id = 4;
        optional fixed32 seed = 5;
}

message WeaponFire {
        optional uint32 gun_id = 1; // 4 bits
        optional uint32 shooter = 2;
        optional uint32 ship_id = 3; // if missile, which id?
        // Set by a client that already fired locally (client-side prediction).
        // The server echoes it back unchanged so the client can recognise its
        // own shot and only record the missile id mapping instead of firing twice.
        optional uint32 client_seq = 4;
}

// Authoritative per-ship health snapshot.  Wing Commander applies damage with
// two different models depending on the ship slot (slot 0 = the local player,
// slots 1-9 = NPC), so the owner of a ship replicates the resulting state
// instead of every machine replaying the hit.  Field comments give the
// data-segment arrays (see scripts/wcdis.py sym dseg:XXXX).
message ShipHealth {
        repeated sint32 shield = 1 [packed=true];      // dseg:C430 curShield[2] (front, rear)
        repeated sint32 shield_max = 2 [packed=true];  // dseg:C988 shieldMax[2]
        repeated sint32 armor = 3 [packed=true];       // dseg:C85E armorState[4]
        optional sint32 damage_points = 4;             // dseg:C17A accumulated hull damage
        optional uint32 core_hp = 5;                   // dseg:C8B8 core hit points (starts at 4)
        optional uint32 hull_counter = 6;              // dseg:D22C internal damage counter
        optional uint32 state_byte = 7;                // dseg:D1A2 ship state
        optional uint32 gun_damage = 8;                // dseg:BD0E
        optional uint32 engine_flag = 9;               // dseg:BFD6
        optional sint32 gun_energy = 10;               // dseg:BE3A
}

message Spawn {
        optional uint32 mission_ship_id = 1;
        optional uint32 situation_id = 2;
        optional uint32 ship_id = 3;
        optional fixed32 seed = 5;
}

message Despawn {
        optional uint32 ship_id = 1;
        optional uint32 shooter = 2;
        optional uint32 explode = 3;
}

message ShipUpdate {
        optional uint32 ship_id = 1; // 16 bits
        optional Location loc = 2;
        optional ShipHealth health = 3; // only from the ship's owner
}

enum GameState {
     Proceed = 0;
     EndLand = 1;
     EndEject = 2;
     EndCarrier = 3;
     EndDeath = 4;
     EndExit = 5;
}

enum AutoPilotState {
     Disengaged = 0;
     Engaged = 1;
     Finished = 2;
}

message AutoPilotEvent {
   optional uint32 cam_ship_type = 1;
   optional uint32 cam_mode = 2;
   optional uint32 duration = 3;
   optional bool finish_camera = 4;
}

message Event {
  optional Spawn spawn = 2;
  optional Damage damage = 3;
  optional WeaponFire fire = 4;
  optional Despawn despawn = 5;
  optional AutoPilotEvent autopiloting = 16;
}

message MissionEnd {
    optional GameState game_update = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 victory_points_plus_one = 3;
}

// Client -> server: this player's own mission ended (death or ejection).  The
// server removes the player's ship and the mission continues for everyone
// else.  Landing is still a shared mission end and travels in MissionEnd.
message PlayerEnd {
    optional GameState state = 1;
}

message Frame {
    repeated ShipUpdate update = 1; // one update per updated ship
    repeated Event event = 2;
    optional MissionEnd mission_end = 18;
    optional PlayerEnd player_end = 19;
}

// Connect -> once per mission
message Connect {
    optional string callsign = 1;
    optional string lastname = 2;
}

message Game {
    optional uint32 mission_id = 1;
    required uint32 assigned_player_id = 2;
    optional Frame starting_state = 3;
}

message ClientStartMissionReq {

}
message ClientStartBriefingReq {

}
message Chat {
    optional string message = 1;
    optional uint32 ship_id = 2;
    optional string callsign = 3;
}
message ServerSendBriefingStart {
    optional uint32 mission_id = 1;
    optional bytes mission_tree_progress = 2;
    optional uint32 series_id = 3;
}
message NetworkMessage {
    optional Connect connect = 1;
    optional Game game = 2;
    optional Frame frame = 3;
    optional ClientStartMissionReq start_mission_req = 4;
    optional uint32 epoch = 5;
    optional uint64 frame_number = 6;
    optional Chat chat = 7;

// handshake
    optional ClientStartBriefingReq start_briefing_req = 16;
    optional ServerSendBriefingStart briefing_start = 17;
}
